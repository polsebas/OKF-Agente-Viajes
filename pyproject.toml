[project]
name = "okf-travel-agent"
version = "0.1.0"
description = "Agente personal de itinerarios de viaje sobre un vault Obsidian tratado como bundle OKF."
requires-python = ">=3.11"
dependencies = [
    "agno>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "sentence-transformers>=3.0",
    "gitpython>=3.1",
    "apscheduler>=3.10",
    "openai>=1.0",
    "anthropic>=0.40",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "memgraphrag-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "core", "tools", "schemas", "memory", "evaluation"]

# Checkout local con FactCategory, expand_fact_evidence y poda TTL.
# Desde el directorio padre (OKF-Agente-VIajes) es `pip install -e ../memgraphrag-core`.
# Desde este paquete el mismo árbol queda en ../../memgraphrag-core.
# Sin checkout: uv add "memgraphrag-core @ git+https://github.com/polsebas/memgraphrag-core.git"
[tool.uv.sources]
memgraphrag-core = { path = "../../memgraphrag-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
